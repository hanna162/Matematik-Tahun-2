    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F0FDF4;
            color: #1F2937;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        
        h1, h2, h3, h4, .font-kids {
            font-family: 'Fredoka', sans-serif;
        }

        .btn-pop {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s;
        }
        .btn-pop:active {
            transform: scale(0.95);
        }

        #drawing-canvas {
            touch-action: none;
            background-color: white;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 0.75rem;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            width: 100%;
            height: 200px; /* Saiz mesra scroll diubah seperti diminta */
            cursor: crosshair;
        }

        .hide { display: none !important; }
        
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
        }
        .fraction span:first-child { border-bottom: 2px solid currentColor; padding: 0 2px; }
        .fraction span:last-child { padding: 0 2px; }
    </style>
</head>

                const hA = (h % 12) * 30 + (m * 0.5);
                const mA = m * 6;
                return `<svg viewBox="0 0 100 100" class="w-32 h-32 mx-auto my-4 drop-shadow-md"><circle cx="50" cy="50" r="45" fill="white" stroke="#374151" stroke-width="4"/><line x1="50" y1="50" x2="${50 + 25 * Math.sin(hA * Math.PI / 180)}" y2="${50 - 25 * Math.cos(hA * Math.PI / 180)}" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="${50 + 35 * Math.sin(mA * Math.PI / 180)}" y2="${50 - 35 * Math.cos(mA * Math.PI / 180)}" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#1f2937"/></svg>`;
            },
            groups: (g, i, e='🍎') => {
                let html = '<div class="flex flex-wrap justify-center gap-4 my-4">';
                for(let k=0; k<g; k++) {
                    html += '<div class="bg-white p-2 rounded-xl border-2 border-dashed border-blue-300 text-2xl flex flex-wrap max-w-[100px] justify-center gap-1 shadow-sm">';

            },
            fraction: (n, d) => {
                let html = '<div class="flex justify-center mx-auto my-6 border-4 border-gray-800 rounded-lg overflow-hidden w-64 h-12 shadow-md">';

                return html;
            },
            shape3D: (type) => {

                if(type === 'kubus') svg = `<svg viewBox="0 0 100 100" class="w-32 h-32 mx-auto my-4 drop-shadow-md" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"><path d="M30 30h40v40H30z" fill="#bfdbfe"/><path d="M30 30l15-15h40l-15 15z" fill="#93c5fd"/><path d="M70 30l15-15v40l-15 15z" fill="#60a5fa"/></svg>`;

                return svg;
            },
            shape2D: (type) => {
                let svg = '';
                if(type === 'bulatan') svg = `<svg viewBox="0 0 100 100" class="w-32 h-32 mx-auto my-4 drop-shadow-md"><circle cx="50" cy="50" r="40" fill="#fde047" stroke="#ca8a04" stroke-width="4"/></svg>`;

                return svg;
            },
            ruler: () => `<svg viewBox="0 0 200 60" class="w-full max-w-sm mx-auto my-4 drop-shadow-md"><rect x="0" y="10" width="200" height="40" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/><line x1="20" y1="10" x2="20" y2="30" stroke="#ca8a04" stroke-width="3"/><line x1="100" y1="10" x2="100" y2="30" stroke="#ca8a04" stroke-width="3"/><line x1="180" y1="10" x2="180" y2="30" stroke="#ca8a04" stroke-width="3"/><text x="16" y="45" font-size="14" font-weight="bold" fill="#ca8a04">0</text><text x="96" y="45" font-size="14" font-weight="bold" fill="#ca8a04">1</text><text x="176" y="45" font-size="14" font-weight="bold" fill="#ca8a04">2</text></svg>`,
            scale: () => `<svg viewBox="0 0 100 100" class="w-24 h-24 mx-auto my-4 drop-shadow-md"><rect x="30" y="50" width="40" height="30" rx="5" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><path d="M20 50 Q50 20 80 50 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><circle cx="50" cy="45" r="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/><line x1="50" y1="45" x2="55" y2="38" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/></svg>`,
            beaker: () => `<svg viewBox="0 0 100 100" class="w-24 h-24 mx-auto my-4 drop-shadow-md"><path d="M35 15 L35 85 A15 10 0 0 0 65 85 L65 15" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M35 50 L35 85 A15 10 0 0 0 65 85 L65 50 Z" fill="#60a5fa" opacity="0.6"/><line x1="35" y1="40" x2="45" y2="40" stroke="#94a3b8" stroke-width="2"/><line x1="35" y1="60" x2="45" y2="60" stroke="#94a3b8" stroke-width="2"/></svg>`
        };

        function addVisualsToDB() {
            if(dbQs['s2_1_1']) {

            // Visual tambahan untuk soalan ukuran
            if(dbQs['s2_4_1']) { dbQs['s2_4_1'][2].visual = visualHelper.ruler(); dbQs['s2_4_1'][5].visual = visualHelper.ruler(); }
            if(dbQs['s2_4_2']) { dbQs['s2_4_2'][5].visual = visualHelper.scale(); dbQs['s2_4_2'][9].visual = visualHelper.scale(); }

            // Visual pembaikan pepijat untuk soalan KBAT (Penyelesaian Masalah) - guna icon simbolik besar berbanding kumpulan yg tidak mencukupi
            if(dbQsKb['s1_2_1']) {
                dbQsKb['s1_2_1'][0].visual = `<div class="text-6xl text-center my-4 drop-shadow-md">🧺 🍎🍏</div>`; // bakul epal
                dbQsKb['s1_2_1'][1].visual = `<div class="text-6xl text-center my-4 drop-shadow-md">👦🏻 🏷️</div>`; // pelekat
            }
            if(dbQsKb['s1_2_3']) {
                dbQsKb['s1_2_3'][0].visual = `<div class="text-6xl text-center my-4 drop-shadow-md">🚗🚗🚗🚗🚗</div>`; // 5 kereta
                dbQsKb['s1_2_3'][1].visual = `<div class="text-6xl text-center my-4 drop-shadow-md">✏️✏️✏️</div>`; // 3 kotak pensel
            }
            if(dbQsKb['s1_2_4']) {
                dbQsKb['s1_2_4'][0].visual = `<div class="text-6xl text-center my-4 drop-shadow-md">🏫 👨‍🎓👩‍🎓</div>`; // murid
                dbQsKb['s1_2_4'][2].visual = `<div class="text-6xl text-center my-4 drop-shadow-md">🫙🫙🫙</div>`; // 3 balang
            }
            if(dbQsKb['s2_1_1']) {
                dbQsKb['s2_1_1'][0].visual = visualHelper.fraction(1, 4);
                dbQsKb['s2_1_1'][1].visual = visualHelper.fraction(3, 10);
                dbQsKb['s2_1_1'][2].visual = visualHelper.fraction(1, 2);
            }
        }
        addVisualsToDB();

        const mathEngine = {
            rnd: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
            genOpts: (ans, isMoney = false) => {
                let opts = [ans];
                while(opts.length < 4) {
                    let w;
                    if(typeof ans === 'number') {
                        let varAmt = Math.max(2, Math.floor(ans * 0.1));
                        w = ans + (Math.random() > 0.5 ? 1 : -1) * mathEngine.rnd(1, varAmt + 3);
                        if (w < 0) w = Math.abs(w) + 1;
                    } else if (isMoney) { 
                        let val = parseFloat(ans.replace('RM ', ''));
                        let wVal = val + (Math.random() > 0.5 ? 1 : -1) * (mathEngine.rnd(1, 5) * 0.5);
                        if(wVal < 0) wVal = val + 1.5;
                        w = `RM ${wVal.toFixed(2)}`;
                    } else { 
                        w = ans + " (Salah)"; 
                    }
                    if(!opts.includes(w)) opts.push(w);
                }
                return opts.sort(() => Math.random() - 0.5);
            },
            
            genTambah: () => {
                let a = mathEngine.rnd(100, 450);
                let b = mathEngine.rnd(50, 450);
                let ans = a + b;
                return { q: `${a} + ${b} = ?`, a: ans.toString(), opts: mathEngine.genOpts(ans).map(String) };
            },
            genTolak: () => {
                let a = mathEngine.rnd(300, 900);
                let b = mathEngine.rnd(50, a - 10);
                let ans = a - b;
                return { q: `${a} - ${b} = ?`, a: ans.toString(), opts: mathEngine.genOpts(ans).map(String) };
            },
            genDarab: () => {
                let sifir = mathEngine.rnd(2, 5);
                if(Math.random() > 0.8) sifir = 10;
                let b = mathEngine.rnd(2, 9);
                let ans = sifir * b;
                let emojis = ['🍎','🍩','⚽','⭐','🎈'];
                let em = emojis[mathEngine.rnd(0, emojis.length-1)];
                let v = (sifir <= 5 && b <= 6) ? visualHelper.groups(b, sifir, em) : null;
                return { q: `${b} x ${sifir} = ?`, a: ans.toString(), opts: mathEngine.genOpts(ans).map(String), visual: v };
            },
            genBahagi: () => {
                let b = mathEngine.rnd(2, 5);
                if(Math.random() > 0.8) b = 10;
                let ans = mathEngine.rnd(2, 9);
                let a = b * ans;
                let emojis = ['🍪','🍬','🍓','🍕'];
                let em = emojis[mathEngine.rnd(0, emojis.length-1)];
                let v = (b <= 5 && ans <= 5) ? visualHelper.groups(ans, b, em) : null;
                return { q: `${a} ÷ ${b} = ?`, a: ans.toString(), opts: mathEngine.genOpts(ans).map(String), visual: v };
            },
            genWangTambahTolak: () => {
                let isTambah = Math.random() > 0.5;
                let r1 = mathEngine.rnd(10, 50);
                let r2 = mathEngine.rnd(5, 30);
                if(!isTambah && r1 < r2) { let temp=r1; r1=r2; r2=temp; }
                let ans = isTambah ? r1+r2 : r1-r2;
                let op = isTambah ? '+' : '-';
                let ansStr = `RM ${ans}.00`;
                let visual = `<div class="text-6xl text-center my-4 drop-shadow-md">💵 🪙</div>`;
                return { q: `RM ${r1}.00 ${op} RM ${r2}.00 = ?`, a: ansStr, opts: mathEngine.genOpts(ansStr, true), visual: visual };
            },
            genWangDarabBahagi: () => {
                let isDarab = Math.random() > 0.5;
                let visual = `<div class="text-6xl text-center my-4 drop-shadow-md">💳 💰</div>`;
                if(isDarab) {
                    let r = mathEngine.rnd(2, 10);
                    let s = mathEngine.rnd(2, 5);
                    let ansStr = `RM ${(r*s)}.00`;
                    return { q: `RM ${r}.00 x ${s} = ?`, a: ansStr, opts: mathEngine.genOpts(ansStr, true), visual: visual };
                } else {
                    let s = mathEngine.rnd(2, 5);
                    let ans = mathEngine.rnd(2, 10);
                    let r = s * ans;
                    let ansStr = `RM ${ans}.00`;
                    return { q: `RM ${r}.00 ÷ ${s} = ?`, a: ansStr, opts: mathEngine.genOpts(ansStr, true), visual: visual };
                }
            }
        };

        const quizLogic = {
            getQuestionsForSubtopic: function(subId) {
                let qs = [];
                let kbQs = [];
                
                // Ambil soalan KBAT (jika wujud)
                if (dbQsKb && dbQsKb[subId]) {
                    kbQs = dbQsKb[subId].map(item => ({
                        q: item.q, a: item.a, visual: item.visual, opts: [...item.opts].sort(() => Math.random() - 0.5)
                    }));
                }

                // Kira berapa soalan biasa diperlukan untuk mencukupkan tepat 10
                let normalCount = 10 - kbQs.length;

                // Jika topik ini mempunyai set hardcoded di dalam dbQs
                if (dbQs[subId]) {
                    let shuffledDb = [...dbQs[subId]].sort(() => Math.random() - 0.5);
                    qs = shuffledDb.slice(0, normalCount).map(item => ({
                        q: item.q, a: item.a, visual: item.visual, opts: [...item.opts].sort(() => Math.random() - 0.5)
                    }));
                } else {
                    // Jika tiada hardcoded (untuk operasi asas), kita jana procedural
                    for(let i=0; i<normalCount; i++) {
                        if (subId === 's1_2_1') qs.push(mathEngine.genTambah());
                        else if (subId === 's1_2_2') qs.push(mathEngine.genTolak());
                        else if (subId === 's1_2_3') qs.push(mathEngine.genDarab());
                        else if (subId === 's1_2_4') qs.push(mathEngine.genBahagi());
                        else if (subId === 's2_2_1') qs.push(mathEngine.genWangTambahTolak());
                        else if (subId === 's2_2_2') qs.push(mathEngine.genWangDarabBahagi());
                        else qs.push(mathEngine.genTambah());
                    }
                }

                // Cantumkan normal + KBAT, pulangkan TEPAT 10 SOALAN
                return qs.concat(kbQs);
            },

            getExamSet: function(setNum) {
                let qs = [];
                
                // 10 Conceptual from Vol 1
                for(let i=1; i<=4; i++) {
                    let subQs = dbQs[`s1_1_${i}`];
                    qs.push(subQs[mathEngine.rnd(0, subQs.length-1)]);
                    if(i<3) qs.push(subQs[mathEngine.rnd(0, subQs.length-1)]);
                }
                // 12 Arithmetic
                for(let i=0; i<3; i++) qs.push(mathEngine.genTambah());
                for(let i=0; i<3; i++) qs.push(mathEngine.genTolak());
                for(let i=0; i<2; i++) qs.push(mathEngine.genDarab());
                for(let i=0; i<2; i++) qs.push(mathEngine.genBahagi());
                qs.push(mathEngine.genWangTambahTolak());
                qs.push(mathEngine.genWangDarabBahagi());
                
                // 12 Conceptual from Vol 2 + KBAT
                let v2Topics = ['s2_1_1', 's2_1_2', 's2_3_1', 's2_3_2', 's2_4_1', 's2_4_2', 's2_4_3', 's2_5_1', 's2_5_2', 's2_6_1'];
                v2Topics.forEach(t => {
                    let subQs = dbQs[t];
                    qs.push(subQs[mathEngine.rnd(0, subQs.length-1)]);
                    if (dbQsKb[t] && Math.random() > 0.5) qs.push(dbQsKb[t][mathEngine.rnd(0, dbQsKb[t].length-1)]);
                });
                
                // Since operations are random and we shuffle, Set 1 and Set 2 will always be unique!
                let finalSet = qs.sort(() => Math.random() - 0.5).slice(0, 30);
                
                return finalSet.map(item => ({
                    q: item.q, a: item.a, visual: item.visual, opts: [...item.opts].sort(() => Math.random() - 0.5)
                }));
            }
        };

            showGames: () => {
                ui.showModal('Zon Permainan Matematik', 'Mari uji kepantasan anda mencongak operasi asas! Jawab sebanyak mungkin dalam masa 30 saat.', `
                    <button onclick="ui.hideModal(); gameApp.start()" class="btn-pop bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-3 rounded-xl font-bold text-lg w-full mb-3 shadow-md">Mula Cabaran Masa ⏱️</button>
                    <button onclick="ui.hideModal()" class="btn-pop bg-gray-200 text-gray-700 px-4 py-3 rounded-xl font-bold w-full border border-gray-300">Kembali</button>
                `);
            },
            showProgress: () => {
                const total = appState.progress.totalScore || 0;
                const completed = Object.keys(appState.progress.topicsCompleted).length;
                ui.showModal('🏆 Rekod Pencapaian', `
                    <div class="bg-green-50 p-4 rounded-xl mt-4 border border-green-200">
                        <p class="text-sm text-green-700 mb-1">Jumlah Markah Terkumpul</p>
                        <p class="text-4xl font-kids font-bold text-green-800">${total}</p>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-xl mt-3 border border-blue-200 mb-4">
                        <p class="text-sm text-blue-700 mb-1">Subtopik Diselesaikan</p>
                        <p class="text-2xl font-kids font-bold text-blue-800">${completed} / 20</p>
                    </div>
                `, `<button onclick="ui.hideModal()" class="btn-pop bg-green-500 text-white px-6 py-3 rounded-xl font-bold w-full shadow-md">Teruskan Belajar!</button>`);
            }
        };

        const canvasApp = {
            canvas: null, ctx: null, isDrawing: false, currentTool: 'pen', lastX: 0, lastY: 0,
            
            init: function() {
                this.canvas = document.getElementById('drawing-canvas');
                this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
                
                this.resize();
                window.addEventListener('resize', () => {
                    if(!document.getElementById('screen-quiz').classList.contains('hide')) this.resize();
                });

                this.canvas.addEventListener('mousedown', this.startDrawing.bind(this));
                this.canvas.addEventListener('mousemove', this.draw.bind(this));
                this.canvas.addEventListener('mouseup', this.stopDrawing.bind(this));
                this.canvas.addEventListener('mouseout', this.stopDrawing.bind(this));

                this.canvas.addEventListener('touchstart', (e) => { e.preventDefault(); this.startDrawing(e.touches[0]); }, {passive: false});
                this.canvas.addEventListener('touchmove', (e) => { e.preventDefault(); this.draw(e.touches[0]); }, {passive: false});
                this.canvas.addEventListener('touchend', this.stopDrawing.bind(this));
                
                this.setTool('pen');
            },
            resize: function() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = this.canvas.width; tempCanvas.height = this.canvas.height;
                if(this.canvas.width > 0) tempCanvas.getContext('2d').drawImage(this.canvas, 0, 0);

                this.canvas.width = rect.width;
                this.canvas.height = 200; // Fixed 200px compact
                
                this.ctx.drawImage(tempCanvas, 0, 0);
                this.setTool(this.currentTool); 
            },
            getPos: function(evt) {
                const rect = this.canvas.getBoundingClientRect();
                return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
            },
            startDrawing: function(e) {
                this.isDrawing = true;
                const pos = this.getPos(e);
                this.lastX = pos.x; this.lastY = pos.y;
            },
            draw: function(e) {
                if (!this.isDrawing) return;
                const pos = this.getPos(e);
                
                this.ctx.beginPath();
                this.ctx.moveTo(this.lastX, this.lastY);
                this.ctx.lineTo(pos.x, pos.y);
                this.ctx.stroke();
                
                this.lastX = pos.x; this.lastY = pos.y;
            },
            stopDrawing: function() {
                this.isDrawing = false;
                this.ctx.beginPath();
            },
            setTool: function(tool) {
                this.currentTool = tool;
                const btnPen = document.getElementById('tool-pen');
                const btnEraser = document.getElementById('tool-eraser');
                
                if (tool === 'pen') {
                    this.ctx.strokeStyle = '#1E3A8A';
                    this.ctx.lineWidth = 3;
                    this.ctx.globalCompositeOperation = 'source-over';
                    btnPen.className = 'btn-pop bg-blue-500 text-white px-3 py-1.5 rounded-lg shadow-sm text-sm font-semibold';
                    btnEraser.className = 'btn-pop bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-semibold';
                } else {
                    this.ctx.lineWidth = 25; 
                    this.ctx.globalCompositeOperation = 'destination-out';
                    btnEraser.className = 'btn-pop bg-blue-500 text-white px-3 py-1.5 rounded-lg shadow-sm text-sm font-semibold';
                    btnPen.className = 'btn-pop bg-white border border-gray-300 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-semibold';
                }
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
            },
            clearCanvas: function() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }
        };

        const quizApp = {
            startSubtopic: function(topicId, subId, title) {
                appState.mode = 'quiz';
                appState.currentTopicId = topicId;
                appState.currentSubtopicId = subId;
                appState.questions = quizLogic.getQuestionsForSubtopic(subId);
                appState.currentIndex = 0;
                appState.score = 0;
                
                document.getElementById('quiz-title').textContent = title;
                document.getElementById('canvas-section').classList.remove('hide');
                
                ui.hideAll();
                document.getElementById('screen-quiz').classList.remove('hide');
                
                setTimeout(() => canvasApp.resize(), 100);
                this.renderQuestion();
            },

            startExam: function(setNum) {
                appState.mode = 'exam';
                appState.questions = quizLogic.getExamSet(setNum);
                appState.currentIndex = 0;
                appState.score = 0;
                appState.userAnswers = new Array(30).fill(null);
                
                document.getElementById('quiz-title').textContent = `Peperiksaan Set ${setNum} (30 Soalan)`;
                document.getElementById('canvas-section').classList.remove('hide');

                ui.hideAll();
                document.getElementById('screen-quiz').classList.remove('hide');
                
                setTimeout(() => canvasApp.resize(), 100);
                this.renderQuestion();
            },

            renderQuestion: function() {
                const q = appState.questions[appState.currentIndex];
                const total = appState.questions.length;
                
                document.getElementById('quiz-progress').textContent = `Soalan ${appState.currentIndex + 1} / ${total}`;
                
                let qText = q.q.replace(/(\d+)\/(\d+)/g, '<span class="fraction"><span>$1</span><span>$2</span></span>');
                let visualHtml = q.visual ? `<div class="w-full mt-4 mb-2 flex justify-center">${q.visual}</div>` : '';
                
                document.getElementById('question-text').innerHTML = qText + visualHtml;
                
                const optsContainer = document.getElementById('answer-options');
                optsContainer.innerHTML = '';
                
                const feedback = document.getElementById('feedback-msg');
                feedback.textContent = '';
                feedback.className = 'text-lg md:text-xl font-bold px-4 py-2 rounded-xl';
                
                document.getElementById('btn-next').classList.add('hide');
                document.getElementById('btn-submit-exam').classList.add('hide');
                
                canvasApp.clearCanvas(); 

                q.opts.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-pop bg-white border-4 border-gray-200 hover:border-blue-500 hover:bg-blue-50 p-5 rounded-2xl text-xl md:text-2xl font-bold text-gray-700 transition-colors shadow-sm';
                    
                    btn.innerHTML = opt.replace(/(\d+)\/(\d+)/g, '<span class="fraction"><span>$1</span><span>$2</span></span>');
                    
                    if(appState.mode === 'quiz') {
                        btn.onclick = () => this.checkAnswer(opt, btn);
                    } else {
                        if(appState.userAnswers[appState.currentIndex] === opt) {
                            btn.classList.replace('border-gray-200', 'border-purple-500');
                            btn.classList.add('bg-purple-50', 'text-purple-700');
                        }
                        btn.onclick = () => {
                            Array.from(optsContainer.children).forEach(c => {
                                c.classList.replace('border-purple-500', 'border-gray-200');
                                c.classList.remove('bg-purple-50', 'text-purple-700');
                            });
                            btn.classList.replace('border-gray-200', 'border-purple-500');
                            btn.classList.add('bg-purple-50', 'text-purple-700');
                            appState.userAnswers[appState.currentIndex] = opt;
                            
                            if (appState.currentIndex < total - 1) {
                                document.getElementById('btn-next').classList.remove('hide');
                            } else {
                                document.getElementById('btn-submit-exam').classList.remove('hide');
                            }
                        };
                    }
                    optsContainer.appendChild(btn);
                });
                
                if (appState.mode === 'exam' && appState.currentIndex < total - 1) {
                    document.getElementById('btn-next').classList.remove('hide');
                    document.getElementById('btn-next').textContent = "Seterusnya ➡️";
                }
            },

            checkAnswer: function(selected, btnElement) {
                const q = appState.questions[appState.currentIndex];
                const optsContainer = document.getElementById('answer-options');
                const feedback = document.getElementById('feedback-msg');
                
                Array.from(optsContainer.children).forEach(btn => btn.disabled = true);
                
                if(selected === q.a) {
                    btnElement.classList.replace('border-gray-200', 'border-green-500');
                    btnElement.classList.replace('hover:border-blue-500', 'border-green-500');
                    btnElement.classList.add('bg-green-100', 'text-green-700');
                    feedback.innerHTML = '✅ <span class="text-green-700">Tepat Sekali!</span>';
                    feedback.classList.add('bg-green-100', 'border-2', 'border-green-300');
                    appState.score++;
                } else {
                    btnElement.classList.replace('border-gray-200', 'border-red-500');
                    btnElement.classList.add('bg-red-50', 'text-red-700');
                    
                    let aText = q.a.replace(/(\d+)\/(\d+)/g, '<span class="fraction"><span>$1</span><span>$2</span></span>');
                    feedback.innerHTML = `❌ <span class="text-red-700">Jawapan betul: ${aText}</span>`;
                    feedback.classList.add('bg-red-100', 'border-2', 'border-red-300');
                    
                    Array.from(optsContainer.children).forEach(btn => {
                        if(btn.innerHTML.includes(q.a) || btn.textContent === q.a) {
                            btn.classList.replace('border-gray-200', 'border-green-500');
                            btn.classList.add('bg-green-50');
                        }
                    });
                }
                
                const nextBtn = document.getElementById('btn-next');
                nextBtn.classList.remove('hide');
                if (appState.currentIndex === appState.questions.length - 1) {
                    nextBtn.textContent = "Lihat Keputusan 🏆";
                } else {
                    nextBtn.textContent = "Seterusnya ➡️";
                }
            },

            nextQuestion: function() {
                if (appState.currentIndex < appState.questions.length - 1) {
                    appState.currentIndex++;
                    this.renderQuestion();
                } else {
                    this.finishQuiz();
                }
            },

            finishQuiz: function() {
                ui.hideAll();
                let finalScore = appState.score;
                let total = appState.questions.length;
                
                if (appState.mode === 'exam') {
                    finalScore = 0;
                    appState.userAnswers.forEach((ans, idx) => {
                        if (ans === appState.questions[idx].a) finalScore++;
                    });
                }
                
                const percent = Math.round((finalScore / total) * 100);
                document.getElementById('result-score').textContent = `${finalScore}/${total}`;
                document.getElementById('result-percent').textContent = `${percent}% Markah`;
                
                let desc = "Kekalkan usaha anda!";
                if(percent === 100) desc = "Cemerlang! Prestasi yang sangat hebat!";
                else if(percent >= 80) desc = "Syabas! Anda menguasai topik ini dengan baik.";
                else if(percent < 50) desc = "Jangan putus asa, mari cuba lagi!";
                document.getElementById('result-desc').textContent = desc;
                
                if (appState.mode === 'quiz') {
                    appState.progress.totalScore += finalScore;
                    if(percent >= 80) {
                        appState.progress.topicsCompleted[appState.currentSubtopicId] = true;
                    }
                    localStorage.setItem('mathT2_progress_v3', JSON.stringify(appState.progress));
                }
                
                document.getElementById('screen-result').classList.remove('hide');
            },

            confirmExit: function() {
                ui.showModal('Keluar Latihan', 'Adakah anda pasti mahu keluar? Rekod jalan kira semasa tidak akan disimpan.', `
                    <button onclick="ui.hideModal(); nav.goHome()" class="btn-pop bg-red-500 text-white px-4 py-3 rounded-xl font-bold w-full mb-2 shadow-sm">Ya, Keluar</button>
                    <button onclick="ui.hideModal()" class="btn-pop bg-gray-200 text-gray-700 px-4 py-3 rounded-xl font-bold w-full border border-gray-300">Batal</button>
                `);
            }
        };

        const gameApp = {
            score: 0,
            timeLeft: 30,
            
            start: function() {
                appState.mode = 'game';
                this.score = 0;
                this.timeLeft = 30;
                
                ui.hideAll();
                document.getElementById('screen-quiz').classList.remove('hide');
                
                document.getElementById('quiz-title').innerHTML = `⏱️ Masa: <span id="game-time" class="text-red-500">30s</span>`;
                document.getElementById('quiz-progress').innerHTML = `⭐ Markah: <span id="game-score">0</span>`;
                document.getElementById('feedback-msg').textContent = "";
                document.getElementById('btn-next').classList.add('hide');
                document.getElementById('canvas-section').classList.add('hide'); 
                
                this.nextRound();
                
                window.gameTimer = setInterval(() => {
                    this.timeLeft--;
                    document.getElementById('game-time').textContent = `${this.timeLeft}s`;
                    if(this.timeLeft <= 0) this.endGame();
                }, 1000);
            },
            
            nextRound: function() {
                const isAdd = Math.random() > 0.5;
                const a = mathEngine.rnd(1, 20);
                const b = mathEngine.rnd(1, 10);
                const ans = isAdd ? a+b : (a>b ? a-b : b-a);
                const op = isAdd ? '+' : '-';
                
                const qText = a>b&&!isAdd ? `${a} - ${b}` : `${isAdd?a:b} ${op} ${isAdd?b:a}`;
                
                document.getElementById('question-text').innerHTML = `<div class="text-center text-4xl py-8">${qText} = ?</div>`;
                
                const optsContainer = document.getElementById('answer-options');
                optsContainer.innerHTML = '';
                
                let opts = mathEngine.genOpts(ans);
                opts.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-pop bg-yellow-100 border-4 border-yellow-400 p-6 rounded-3xl text-3xl font-bold text-yellow-800 shadow-md active:bg-yellow-300';
                    btn.textContent = opt;
                    btn.onclick = () => {
                        if(opt == ans) {
                            this.score += 10;
                            document.getElementById('game-score').textContent = this.score;
                            this.timeLeft += 2; 
                            this.nextRound();
                        } else {
                            btn.classList.replace('bg-yellow-100', 'bg-red-200');
                            btn.classList.replace('border-yellow-400', 'border-red-500');
                            this.timeLeft -= 3; 
                            setTimeout(() => {
                                btn.classList.replace('bg-red-200', 'bg-yellow-100');
                                btn.classList.replace('border-red-500', 'border-yellow-400');
                            }, 300);
                        }
                    };
                    optsContainer.appendChild(btn);
                });
            },
            
            endGame: function() {
                clearInterval(window.gameTimer);
                ui.hideAll();
                document.getElementById('screen-result').classList.remove('hide');
                document.getElementById('result-desc').textContent = "Masa tamat! Anda hebat mencuba cabaran ini.";
                document.getElementById('result-score').textContent = this.score;
                document.getElementById('result-percent').textContent = "Mata Dikumpul";
                
                appState.progress.totalScore += this.score;
                localStorage.setItem('mathT2_progress_v3', JSON.stringify(appState.progress));
            }
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btn-next').addEventListener('click', () => quizApp.nextQuestion());
            document.getElementById('btn-submit-exam').addEventListener('click', () => quizApp.finishQuiz());
            canvasApp.init();
            nav.goHome(); 
        });
    </script>
</body>
